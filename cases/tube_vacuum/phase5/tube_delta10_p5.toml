# 円管 → 真空(論文 §4.1)の GSIS-PBC(δ_rp = 10)。メッシュは構造六面体 tube_hex(135,104 セル)。
# cases/tube_vacuum/phase5/make_cases.py で生成。実行: gsis-solver run <この TOML>(出力は runs/gsis/<ケース名>/)
# 論文: GSIS 1 回 = CIS 5 回 + PBC 10 回、CFL = 500、式 (59) の ε < 1e-5(Table 1)。
# フェーズ 5a の設定(docs/phase5_report.md):
#   CIS: 速度点の向きごとのスイープ順序(octant)、内部反復 4 回(間で拡散壁の流入密度を更新)、ブロック間の反復 2 回、
#        保存的な離散平衡分布、負値は blend
#   論文との違い(残した安定化): 補正の低域フィルタ ℓ = λ、局所 Kn > 1 のセルの凍結、入口の流入の接線速度 0
#   δ = 10 の追加の設定なし

[case]
name = "tube_delta10_p5"
mesh = "../mesh/tube_hex.pmesh"
mode = "gsis"

[gas]
molecular_mass = 6.65e-27           # kg (He)
mu_ref = 1.916e-5                   # Pa s
T_ref = 273.15                      # K
omega = 0.66

[conditions]
L_ref = 1.0e-3                      # m(管半径)
T0 = 273.15                         # K
delta_rp = 10

[[boundary]]
patch = "inlet"
type = "pressure_inlet"
temperature = 273.15
# 流入の速度の接線成分を 0 にする(静止した槽からの流入。論文の式 (65) は内側の値を外挿するが、δ = 100 で入口を通る
# 旋回・循環のモードが 1 反復 1.65 倍で育った。docs/phase5_report.md)
tangential_velocity = "zero"

[[boundary]]
patch = "outlet"
type = "vacuum"

[[boundary]]
patch = "wall"
type = "diffuse_wall"
temperature = 273.15

[velocity_grid]
n = [30, 24, 24]
range = [[-10.0, 10.0], [-8.0, 8.0], [-8.0, 8.0]]   # 単位 sqrt(R*T0)

[gsis]
n_cis = 5
max_pbc = 10
cfl_pbc = 500.0
tolerance = 1.0e-5
max_iterations = 200
filter_length = 1.0

[kinetic]
sweep_blocks = 64
sweep_order = "octant"
inner_sweeps = 4
inner_wall_update = true
block_passes = 2
equilibrium = "discrete"
gsis_negative_check = "blend"
positivity_limiter = false
limiter_k = 3.0

[macro]
advection = "upwind2"
boundary_reconstruction = "limited"
hot_interpolation = "face"
gsis_freeze_kn = 1.0
gsis_cfl_start = 0.0
init_iterations = 50
init_advection = "upwind1"
