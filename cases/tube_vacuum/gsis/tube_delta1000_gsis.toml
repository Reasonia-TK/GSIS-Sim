# 円管 → 真空(論文 §4.1)の GSIS-PBC(δ_rp = 1000)。メッシュは構造六面体 tube_hex(135,104 セル)。
# 実行: gsis-solver run cases/tube_vacuum/gsis/tube_delta1000_gsis.toml(出力は runs/gsis/tube_delta1000_gsis/)
# 論文: GSIS 1 回 = CIS 5 回 + PBC 10 回、CFL = 500、式 (59) の ε < 1e-5(Table 1)。
# 初期化(仮定 A9): 一様な入口の状態(p_in, T0、静止)から NSF のみの PBC を [macro].init_iterations 回まで
# (CFL は 5 から 500 まで SER で上げる、移流項は [macro].init_advection = 1 次)、その状態の平衡分布から GSIS を始める。
# 論文との違い(docs/design_gsis.md §7): 面の HoT、負値は補正で生じた分で判定、補正の低域フィルタ(ℓ = λ)、
# 局所 Kn > 1 のセルの固定、2 次の移流項。
# 未解決(docs/phase4_report.md §5・§7): 最初の GSIS 反復の CIS 4〜5 回目に、真空の出口の手前の冷たい超音速の噴流
# (NSF の初期値で T ≈ 0.11〜0.19、u ≈ 2)で負の温度になって止まる。速度格子(Δξ = 0.67)では T ≲ 0.15 の
# Maxwell 分布の離散モーメントが合わず(T = 0.1 で温度 0.88 倍・密度 1.04 倍)、衝突項のたびに温度が下がり続ける
# (運動論ソルバーの側の問題。positivity_limiter でも同じ)。

[case]
name = "tube_delta1000_gsis"
mesh = "../mesh/tube_hex.pmesh"
mode = "gsis"

[gas]
molecular_mass = 6.65e-27           # kg (He)
mu_ref = 1.916e-5                   # Pa s
T_ref = 273.15                      # K
omega = 0.66

[conditions]
L_ref = 1.0e-3                      # m(管半径)
T0 = 273.15                         # K
delta_rp = 1000.0

[[boundary]]
patch = "inlet"
type = "pressure_inlet"
temperature = 273.15

[[boundary]]
patch = "outlet"
type = "vacuum"

[[boundary]]
patch = "wall"
type = "diffuse_wall"
temperature = 273.15

[velocity_grid]
n = [30, 24, 24]
range = [[-10.0, 10.0], [-8.0, 8.0], [-8.0, 8.0]]   # 単位 sqrt(R*T0)

[gsis]
n_cis = 5
max_pbc = 10
cfl_pbc = 500.0
tolerance = 1.0e-5
max_iterations = 200
# 補正の低域フィルタ ℓ = λ(既定。平均自由行程より短い波長への NSF の過大な補正を消す)
filter_length = 1.0

[kinetic]
sweep_blocks = 64
gsis_negative_check = "created"

[macro]
# 移流項は 2 次(1 次のドナーセルの密度は管の中で質量流量を 2.5% 大きく見せる。docs/phase4_report.md)
advection = "upwind2"
boundary_reconstruction = "limited"
hot_interpolation = "face"
# 局所 Kn > 1 のセル(下流槽の希薄な領域)は PBC の段では動かさず、運動論だけで解く
gsis_freeze_kn = 1.0
init_iterations = 50
init_advection = "upwind1"
