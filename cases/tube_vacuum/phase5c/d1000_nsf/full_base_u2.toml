# フェーズ 5c: 管 δ_rp = 1000 の NSF のみの PBC 単独(pbc-run)のメッシュ依存性(d1000_mesh_study.py で生成)。
# メッシュ: cases/tube_vacuum/mesh/tube_hex.pmesh(全体)
[case]
name = "full_base_u2"
mesh = "../../mesh/tube_hex.pmesh"
mode = "gsis"

[gas]
molecular_mass = 6.65e-27
mu_ref = 1.916e-5
T_ref = 273.15
omega = 0.66

[conditions]
L_ref = 1.0e-3
T0 = 273.15
delta_rp = 1000

[[boundary]]
patch = "inlet"
type = "pressure_inlet"
temperature = 273.15
tangential_velocity = "zero"

[[boundary]]
patch = "outlet"
type = "vacuum"

[[boundary]]
patch = "wall"
type = "diffuse_wall"
temperature = 273.15

[velocity_grid]
n = [30, 24, 24]
range = [[-10.0, 10.0], [-8.0, 8.0], [-8.0, 8.0]]

[gsis]
cfl_pbc = 500.0

[macro]
advection = "upwind2"
boundary_reconstruction = "cell"
