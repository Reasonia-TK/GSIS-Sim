# 円管 → 真空(論文 §4.1)の GSIS-PBC(δ_rp = 1000)。フェーズ 5b-1 の設定(docs/phase5b_d1000_report.md)。
# メッシュは構造六面体 tube_hex(135,104 セル)。実行: gsis-solver run <この TOML>(--init-from runs/phase5/init/d1000.csv で
# NSF の初期化を省ける)。VRAM を 12 GB ほどに抑えるなら --set kinetic.velocity_chunk=1152(結果は変わらない)
# 論文: GSIS 1 回 = CIS 5 回 + PBC 10 回、CFL = 500、式 (59) の ε < 1e-5(Table 1)。
# CIS はフェーズ 5b の既定(octant、内部反復 4 回 + 壁の更新、ブロック間の反復 2 回、保存的な離散平衡、負値は blend)。
# フェーズ 5a からの違い(δ = 1000 だけ):
#   [macro].gsis_face_state = "cell": PBC 段で境界セルの勾配に運動論の境界面のモーメントを使わない(仮定 A7 を変更)。
#       運動論の境界面のモーメントが GSIS の 1 反復遅れで PBC に戻る経路が、上流槽の外側の壁と入口の近くの格子規模のモードを
#       1 反復 2〜2.5 倍に育てていた
#   [kinetic].cold_bgk_temperature = 0.1: 速度格子で解像できない冷たいセル(真空の出口の層、T ≈ 0.01〜0.03)の目標分布を
#       BGK にする(Shakhov の多項式と離散保存の補正で目標分布が負になり、CIS が負の温度になった)
#   [kinetic].deq_fallback = "collisionless"(既定): 離散平衡が作れないセルは衝突なし・GSIS の補正なし
# フェーズ 5a から引き継いだ違い: 局所 Kn > 1 の凍結、補正の低域フィルタ ℓ = λ、入口の接線速度 0、境界面の値はセルの値、
#   PBC 段の CFL の立ち上げ(5 から)、運動論のリミッタ K = 1 と正値の制限

[case]
name = "tube_delta1000_p5b"
mesh = "../mesh/tube_hex.pmesh"
mode = "gsis"

[gas]
molecular_mass = 6.65e-27           # kg (He)
mu_ref = 1.916e-5                   # Pa s
T_ref = 273.15                      # K
omega = 0.66

[conditions]
L_ref = 1.0e-3                      # m(管半径)
T0 = 273.15                         # K
delta_rp = 1000

[[boundary]]
patch = "inlet"
type = "pressure_inlet"
temperature = 273.15
tangential_velocity = "zero"

[[boundary]]
patch = "outlet"
type = "vacuum"

[[boundary]]
patch = "wall"
type = "diffuse_wall"
temperature = 273.15

[velocity_grid]
n = [30, 24, 24]
range = [[-10.0, 10.0], [-8.0, 8.0], [-8.0, 8.0]]   # 単位 sqrt(R*T0)

[gsis]
n_cis = 5
max_pbc = 10
cfl_pbc = 500.0
tolerance = 1.0e-5
max_iterations = 200
filter_length = 1.0

[kinetic]
sweep_blocks = 64
positivity_limiter = true
limiter_k = 1.0
cold_bgk_temperature = 0.1

[macro]
advection = "upwind2"
boundary_reconstruction = "cell"
hot_interpolation = "face"
gsis_face_state = "cell"
gsis_freeze_kn = 1.0
gsis_cfl_start = 5.0
init_iterations = 50
init_advection = "upwind1"
